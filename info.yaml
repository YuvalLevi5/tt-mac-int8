# Tiny Tapeout project information
project:
  title:        "INT8 MAC"
  author:       "Yuval Levi"
  discord:      ""
  description:  "INT8 multiply-accumulate unit: streams operand/weight pairs and accumulates the products in a 32-bit accumulator"
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x1"

  # The top module name must start with "tt_um_".
  top_module:   "tt_um_mac_int8"

  source_files:
    - "project.v"
    - "mac.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "a[0]"
  ui[1]: "a[1]"
  ui[2]: "a[2]"
  ui[3]: "a[3]"
  ui[4]: "a[4]"
  ui[5]: "a[5]"
  ui[6]: "a[6]"
  ui[7]: "a[7]"

  # Outputs
  uo[0]: "acc[0]"
  uo[1]: "acc[1]"
  uo[2]: "acc[2]"
  uo[3]: "acc[3]"
  uo[4]: "acc[4]"
  uo[5]: "acc[5]"
  uo[6]: "acc[6]"
  uo[7]: "acc[7]"

  # Bidirectional pins (used here as inputs: the weight operand)
  uio[0]: "w[0]"
  uio[1]: "w[1]"
  uio[2]: "w[2]"
  uio[3]: "w[3]"
  uio[4]: "w[4]"
  uio[5]: "w[5]"
  uio[6]: "w[6]"
  uio[7]: "w[7]"
